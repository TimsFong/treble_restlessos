name: Audit AWS resources

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  audit:
    name: List build resources
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: EC2 instances (any state, project-tagged)
        run: |
          aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Project,Values=gsi-build" \
            --query 'Reservations[].Instances[].[InstanceId, Tags[?Key=="Name"]|[0].Value, InstanceType, State.Name, LaunchTime, PublicIpAddress || string("")]' \
            --output table

      - name: EBS volumes (project-tagged)
        run: |
          aws ec2 describe-volumes --region "$AWS_REGION" \
            --filters "Name=tag:Project,Values=gsi-build" \
            --query 'Volumes[].[VolumeId, Size, State, Attachments[0].InstanceId || string("unattached"), CreateTime]' \
            --output table

      - name: Unattached volumes of any tag >= 100GB
        run: |
          aws ec2 describe-volumes --region "$AWS_REGION" \
            --filters "Name=status,Values=available" \
            --query 'Volumes[?Size >= `100`].[VolumeId, Size, VolumeType, CreateTime, Tags[?Key==`Name`]|[0].Value || string("no-name")]' \
            --output table

      - name: Key pairs and allocated addresses
        run: |
          aws ec2 describe-key-pairs --region "$AWS_REGION" \
            --query 'KeyPairs[].KeyName' --output table
          aws ec2 describe-addresses --region "$AWS_REGION" \
            --query 'Addresses[].[PublicIp, InstanceId || string("unattached"), Domain]' \
            --output table

      - name: Self-hosted runners
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            --jq '.runners[] | "\(.id) \(.status) \(.name) \(.os)-\(.label[0].name // "?")"' || true
